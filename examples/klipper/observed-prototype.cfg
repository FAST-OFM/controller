# Sanitized machine-specific evidence example. DO NOT DEPLOY UNREVIEWED.
# Fast OFM accepted prototype: 2026-09-09, stop-and-shoot, scanner_sync disabled.

[mcu]
# Replace only after identifying the exact MKS device. Never use a non-unique
# USB by-id path when another CH340 device such as an Arduino is attached.
serial: /dev/serial/by-path/REPLACE_WITH_VERIFIED_MKS_DEVICE
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 20
max_accel: 50
max_z_velocity: 0.4
max_z_accel: 4.0

[idle_timeout]
timeout: 600

# Machine-specific Vref PWM. Verify currents and temperatures independently.
[output_pin motor_current_xy]
pin: PA6
pwm: True
hardware_pwm: True
cycle_time: 0.001
scale: 1.5
value: 0.3
shutdown_value: 0

[output_pin motor_current_z]
pin: PA7
pwm: True
hardware_pwm: True
cycle_time: 0.001
scale: 1.5
value: 0.3
shutdown_value: 0

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 2
endstop_pin: !PA15
position_endstop: 0
position_min: -10
position_max: 200
homing_speed: 10
homing_retract_dist: 0

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 2
endstop_pin: !PA12
position_endstop: 0
position_min: -12
position_max: 200
homing_speed: 10
homing_retract_dist: 0

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 1.0
endstop_pin: !PA11
position_endstop: 0
position_min: -50
position_max: 50
homing_speed: 0.1
homing_positive_dir: false
homing_retract_dist: 0

# The accepted prototype used an operator-defined local reference rather than
# verified physical homing. This preserves that fact; replace it with verified
# homing before treating coordinates as persistent or collision-safe.
[homing_override]
axes: xyz
gcode:
    SET_KINEMATIC_POSITION X=100 Y=100 Z=0
    G90

# Logic gates only. External current-limited LED drivers are mandatory.
[output_pin led_green]
pin: PA9
value: 0
shutdown_value: 0

[output_pin led_red]
pin: PA10
value: 0
shutdown_value: 0

[output_pin led_white]
pin: PB14
value: 0
shutdown_value: 0

[gcode_macro ALL_LIGHTS_OFF]
gcode:
    SET_PIN PIN=led_white VALUE=0
    SET_PIN PIN=led_red VALUE=0
    SET_PIN PIN=led_green VALUE=0

[delayed_gcode FAST_OFM_STARTUP_LIGHTS_OFF]
initial_duration: 0.01
gcode:
    ALL_LIGHTS_OFF
