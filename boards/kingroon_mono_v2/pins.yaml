safety_status:
  homing:
    status: not_exercised
    config_enabled: false
    note: "Homing is disabled at the scanner config level. No limit switches are connected, the A4988 path does not provide driver-assisted end-of-travel detection, and the current homing_override only sets kinematic position."
  legacy_position_event_gpio:
    status: legacy_config_entry_not_current_physical_trigger
    connector: Z+
    measured_high_v: 3.3
    measured_high_source: user_reported_prior_measurement
    prior_usage: "Older simple prototype passed a position/event signal to Raspberry Pi GPIO while the camera captured independently."
    note: "Active config still contains a camera_trigger output_pin on PC4/Z+, but user clarification and photo review indicate the current physical camera/sync trigger wire is on the E0 control-signal area, not on Z+."
  camera_or_sync_trigger:
    status: assigned_hq_xvs_sync_output
    pin: PD6
    connector_or_pad: E0_STEP_control_signal_area
    measured_high_v: 3.3
    measured_high_source: user_multimeter_test_on_2026_07_02
    config_section: output_pin hq_xvs_sync
    macros:
      - HQ_XVS_HIGH
      - HQ_XVS_LOW
      - HQ_XVS_PULSE
      - HQ_XVS_TEST_TRAIN
    note: "Photo review shows the trigger wire in the E0 control-signal area. This signal is now named for HQ Camera XVS sync. It is 3.3 V at the MKS pin and must pass through the approved 3.3 V-to-1.8 V level shifter before HQ XVS. Do not confuse this with the 4-pin E0 motor coil connector."
  led_outputs:
    status: partially_identified_no_load_multimeter
    led_green:
      pin: PA9
      source_signal: WiFi_TXD1
      measured_high_v: 3.3
      measured_high_source: user_multimeter_during_probe
      output_type: raw_logic_control
      led_rated_current_ma: 100
      geometry:
        objective: 20x
        lateral_offset_from_optical_center_mm: 10
        distance_from_tissue_plane_mm: 35
        placement_angle_deg: 16
        applies_to_objectives:
          - 20x
        must_not_reuse_for_objectives:
          - 40x
      load_tested: false
      note: "Assigned as green LED gate after WiFi-header no-load probe. Current 20x LED geometry uses a 100 mA-class LED at 10 mm lateral offset, 35 mm from tissue plane and 16 degree placement angle. Requires external MOSFET/transistor and LED current limiting."
    led_red:
      pin: PA10
      source_signal: WiFi_RXD1
      measured_high_v: 3.3
      measured_high_source: user_multimeter_during_probe
      output_type: raw_logic_control
      led_rated_current_ma: 100
      geometry:
        objective: 20x
        lateral_offset_from_optical_center_mm: 10
        distance_from_tissue_plane_mm: 35
        placement_angle_deg: 16
        applies_to_objectives:
          - 20x
        must_not_reuse_for_objectives:
          - 40x
      load_tested: false
      note: "Assigned as red LED gate after WiFi-header no-load probe. Current 20x LED geometry uses a 100 mA-class LED at 10 mm lateral offset, 35 mm from tissue plane and 16 degree placement angle. Requires external MOSFET/transistor and LED current limiting."
    led_white:
      pin: PB13
      source_signal: TC1_SCK
      output_type: raw_logic_control
      active_polarity: positive
      active_value: 1
      inactive_value: 0
      load_tested: false
      status: assigned_no_load_multimeter_checked_tc1_header
      note: "Assigned as white LED gate through TC1 SCK/PB13 after physical blink probe. Requires external MOSFET/transistor and LED current limiting."
    e0_vref:
      pin: PB0
      source_signal: E0_VREF
      status: not_usable_for_led_gate
      measured_when_commanded_high_v: 0
      measured_source: user_multimeter_during_probe
      note: "Klipper probe readback reached VALUE=1, but measured output stayed 0 V. Do not use PB0/E0_VREF as LED gate."
    superseded_e0_led_candidates:
      led_green_prior:
        pin: PD3
        source_signal: E0_DIR
        status: superseded_by_wifi_header_mapping
      led_red_prior:
        pin: "!PB3"
        source_signal: E0_ENABLE
        status: superseded_by_wifi_header_mapping
        note: "Active-low/inverted E0 enable path; avoid for LED gate unless explicitly needed."
      led_white_prior:
        pin: PB1
        source_signal: FAN
        status: superseded_by_tc1_sck_mapping
        note: "Board fan/MOSFET load output; no longer the primary white LED gate."
