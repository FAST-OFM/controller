  - whether PC4/Z+ should be removed from active config or retained only as a disabled diagnostic
  - exact physical pad/testpoint used for PD6/E0_STEP trigger wire
  - MKS connect timeout root cause after the HQ XVS config rename and serial path update
  - measured IO voltage levels beyond prior PD6/E0_STEP, PC4/Z+, PA9/WiFi TXD1, PA10/WiFi RXD1 and PB13/TC1 SCK checks
  - safe dummy-load test for PA9/PA10/PB13 LED candidates
  - TC1 SCK/PB13 boot/reset state
  - unresolved TC1 CS mapping; PB12 and PD15 did not blink the physical CS terminal during no-load probe
